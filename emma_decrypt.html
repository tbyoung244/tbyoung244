<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Decrypt message</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; padding:18px; }
    textarea { width:100%; box-sizing:border-box; }
    input[type=password] { width:100%; box-sizing:border-box; padding:8px; }
    pre { background:#f1f1f1; padding:10px; border-radius:8px; white-space:pre-wrap; }
    button { padding:10px 14px; font-size:16px; border-radius:8px; }
  </style>
</head>
<body>
  <h2>Decrypt message</h2>
  <p>Paste the one-line base64 ciphertext you received, enter the passphrase, and click Decrypt.</p>
  <label>Base64 ciphertext</label><br>
  <textarea id="b64" rows="6" placeholder="Paste the one-line base64 here"></textarea><br><br>
  <label>Passphrase</label><br>
  <input id="pw" type="password" placeholder="Type passphrase"><br><br>
  <button id="go">Decrypt</button>
  <p id="status"></p>
  <pre id="out"></pre>

  <!-- scrypt-async library -->
  <script src="https://unpkg.com/scrypt-async@1.3.0/scrypt-async.js"></script>

<script>
function b64ToBytes(b64){
  return Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
}

function bytesToStr(b){
  return new TextDecoder().decode(b);
}

function scryptDerive(pass, saltStr, N, r, p, dkLen) {
  return new Promise((resolve, reject) => {
    scrypt(pass, saltStr, { N: N, r: r, p: p, dkLen: dkLen, encoding: 'binary' }, function(derived){
      const arr = new Uint8Array(derived.length);
      for (let i=0;i<derived.length;i++) arr[i] = derived.charCodeAt(i);
      resolve(arr);
    });
  });
}

async function importAesKey(raw) {
  return await crypto.subtle.importKey("raw", raw, {name:"AES-GCM"}, false, ["decrypt"]);
}

document.getElementById('go').onclick = async () => {
  const out = document.getElementById('out');
  const status = document.getElementById('status');
  out.textContent = "";
  status.textContent = "Working...";
  try {
    const b64 = document.getElementById('b64').value.trim();
    const pw  = document.getElementById('pw').value;
    if (!b64 || !pw) throw "Provide both ciphertext and passphrase.";
    const bin = b64ToBytes(b64);
    if (bin.length < 44) throw "Ciphertext too short.";

    // parse: salt(16) | nonce(12) | tag(16) | ciphertext
    const salt = bin.slice(0,16);
    const nonce = bin.slice(16,28);
    const tag = bin.slice(28,44);
    const ct = bin.slice(44);

    // reconstruct ciphertext+tag as WebCrypto expects
    const ctWithTag = new Uint8Array(ct.length + tag.length);
    ctWithTag.set(ct, 0);
    ctWithTag.set(tag, ct.length);

    // scrypt params (must match Python encryption)
    const N = 2**15; // 32768
    const r = 8;
    const p = 1;
    const dkLen = 32;

    // FIXED: convert salt to string for scrypt-async
    const saltStr = String.fromCharCode(...salt);

    const keyBytes = await scryptDerive(pw, saltStr, N, r, p, dkLen);
    const cryptoKey = await importAesKey(keyBytes.buffer);

    const plainBuf = await crypto.subtle.decrypt({name:"AES-GCM", iv: nonce}, cryptoKey, ctWithTag.buffer);
    const plaintext = bytesToStr(new Uint8Array(plainBuf));
    out.textContent = plaintext;
    status.textContent = "Decryption successful.";
  } catch (e) {
    status.textContent = "Decryption failed.";
    out.textContent = String(e);
  }
};
</script>
</body>
</html>
