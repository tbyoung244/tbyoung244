<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Encrypt & Decrypt</title>
<style>
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; padding:18px; }
textarea, input[type=password] { width:100%; box-sizing:border-box; padding:8px; margin-bottom:12px; }
pre { background:#f1f1f1; padding:10px; border-radius:8px; white-space:pre-wrap; }
button { padding:10px 14px; font-size:16px; border-radius:8px; margin-right:10px; }
</style>
</head>
<body>
<h2>Encrypt & Decrypt Message</h2>

<label>Message to encrypt:</label>
<textarea id="msg" rows="3" placeholder="Type your message here"></textarea>

<label>Passphrase:</label>
<input id="pw" type="password" placeholder="Type passphrase">

<button id="encryptBtn">Encrypt</button>
<button id="decryptBtn">Decrypt</button>

<p>Encrypted/Decrypted output:</p>
<pre id="out"></pre>

<script>
async function deriveKey(passphrase, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
        "raw", enc.encode(passphrase), {name: "PBKDF2"}, false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
        {name:"PBKDF2", salt: salt, iterations: 32768, hash:"SHA-256"},
        keyMaterial,
        { name:"AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
    );
}

function concatBuffers(...buffers) {
    let totalLen = buffers.reduce((sum,b)=>sum+b.byteLength,0);
    let result = new Uint8Array(totalLen);
    let offset = 0;
    for (let b of buffers) { result.set(new Uint8Array(b), offset); offset+=b.byteLength; }
    return result;
}

function bytesToBase64(bytes) { return btoa(String.fromCharCode(...new Uint8Array(bytes))); }
function base64ToBytes(b64) { return Uint8Array.from(atob(b64), c=>c.charCodeAt(0)); }

document.getElementById('encryptBtn').onclick = async () => {
    const msg = document.getElementById('msg').value;
    const pw  = document.getElementById('pw').value;
    const out = document.getElementById('out');
    if (!msg || !pw) { out.textContent="Message & passphrase required"; return; }

    const enc = new TextEncoder();
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const nonce = crypto.getRandomValues(new Uint8Array(12));

    const key = await deriveKey(pw, salt);
    const ctBuffer = await crypto.subtle.encrypt({name:"AES-GCM", iv:nonce}, key, enc.encode(msg));

    // store as salt|nonce|ciphertext
    const blob = concatBuffers(salt.buffer, nonce.buffer, ctBuffer);
    out.textContent = bytesToBase64(blob);
};

document.getElementById('decryptBtn').onclick = async () => {
    const b64 = document.getElementById('out').textContent.trim();
    const pw  = document.getElementById('pw').value;
    const out = document.getElementById('out');
    if (!b64 || !pw) { out.textContent="Ciphertext & passphrase required"; return; }

    try {
        const blob = base64ToBytes(b64);
        const salt = blob.slice(0,16);
        const nonce = blob.slice(16,28);
        const ct = blob.slice(28);

        const key = await deriveKey(pw, salt);
        const plainBuffer = await crypto.subtle.decrypt({name:"AES-GCM", iv:nonce}, key, ct.buffer);
        const dec = new TextDecoder().decode(plainBuffer);
        out.textContent = dec;
    } catch(e) {
        out.textContent = "Decryption failed: " + e;
    }
};
</script>
</body>
</html>
